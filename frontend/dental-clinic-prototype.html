<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suvidha Dental — Clinic Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8FA;
  --surface:#FFFFFF;
  --surface-2:#F0F5F7;
  --primary:#0C6E8C;
  --primary-dark:#0A4F66;
  --primary-light:#E4F1F5;
  --accent:#14B8A6;
  --accent-light:#E1F7F3;
  --ink:#132430;
  --ink-2:#33495A;
  --muted:#68808F;
  --border:#DDE7EB;
  --success:#1A9E5C;
  --success-bg:#E5F7ED;
  --warning:#C7790A;
  --warning-bg:#FDF1E1;
  --danger:#D2402F;
  --danger-bg:#FBEAE7;
  --info:#3563C9;
  --info-bg:#EAF0FC;
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(19,36,48,0.06);
  --shadow-md:0 6px 20px rgba(19,36,48,0.08);
  --shadow-lg:0 16px 40px rgba(19,36,48,0.14);
  --sidebar-w:250px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
::selection{background:var(--accent-light);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#C3D3D9;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- App shell ---------- */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);
  background:linear-gradient(180deg,var(--primary-dark),var(--primary) 70%);
  color:#fff;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 20px 18px 22px;
  border-bottom:1px solid rgba(255,255,255,0.14);
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora';font-weight:700;color:#053B34;font-size:16px;
  flex-shrink:0;
}
.brand-name{font-family:'Sora';font-weight:700;font-size:15.5px;letter-spacing:0.2px;line-height:1.15;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.6);letter-spacing:1.2px;text-transform:uppercase;margin-top:1px;}
.role-pill{
  margin:14px 20px 4px 20px;
  padding:8px 12px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:10px;
  font-size:11.5px;color:rgba(255,255,255,0.85);
  display:flex;align-items:center;justify-content:space-between;
}
.nav{flex:1;overflow-y:auto;padding:10px 12px;}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:rgba(255,255,255,0.45);padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9.5px 12px;margin:2px 0;border-radius:9px;
  font-size:13.6px;font-weight:500;color:rgba(255,255,255,0.82);
  cursor:pointer;transition:background .12s ease;
  border:1px solid transparent;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.9;}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:rgba(255,255,255,0.16);color:#fff;border-color:rgba(255,255,255,0.14);}
.sidebar-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,0.14);}
.switch-role-btn{
  width:100%;padding:9px 10px;border-radius:9px;border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.06);color:#fff;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;justify-content:center;
}
.switch-role-btn:hover{background:rgba(255,255,255,0.14);}

.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:66px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;position:sticky;top:0;z-index:30;
}
.topbar-left{display:flex;align-items:center;gap:16px;}
.page-title{font-size:18px;font-weight:700;}
.crumb{font-size:12px;color:var(--muted);}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;width:280px;color:var(--muted);
}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--border);
  position:relative;color:var(--ink-2);
}
.icon-btn svg{width:17px;height:17px;}
.dot-badge{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid #fff;}
.branch-select{
  font-size:12.5px;border:1px solid var(--border);background:var(--surface-2);
  padding:8px 10px;border-radius:10px;color:var(--ink-2);font-weight:500;
}
.avatar{
  width:38px;height:38px;border-radius:50%;background:var(--accent-light);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:13px;
  border:1px solid var(--border);
}
.user-block{display:flex;align-items:center;gap:10px;padding-left:10px;border-left:1px solid var(--border);}
.user-name{font-size:13px;font-weight:600;line-height:1.2;}
.user-role{font-size:11px;color:var(--muted);}

.content{padding:26px;flex:1;}
.content-inner{max-width:1360px;}

/* ---------- Grid / layout helpers ---------- */
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.row{display:flex;gap:18px;}
.col{flex:1;min-width:0;}
.mt{margin-top:18px;}
.mt-sm{margin-top:10px;}
.mb{margin-bottom:18px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.flex{display:flex;align-items:center;}
.gap-8{gap:8px;}
.gap-10{gap:10px;}
.gap-14{gap:14px;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card-title{font-size:14.5px;font-weight:700;font-family:'Sora';}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px;}

.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.stat-icon svg{width:18px;height:18px;}
.stat-value{font-family:'Sora';font-size:26px;font-weight:700;margin-top:12px;}
.stat-label{font-size:12.5px;color:var(--muted);margin-top:2px;}
.stat-delta{font-size:11.5px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;}
.delta-up{color:var(--success);background:var(--success-bg);}
.delta-down{color:var(--danger);background:var(--danger-bg);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:10px 16px;border-radius:10px;font-size:13.2px;font-weight:600;border:1px solid transparent;
  transition:all .12s ease;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-accent{background:var(--accent);color:#04352E;}
.btn-accent:hover{filter:brightness(0.95);}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);}
.btn-outline:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;color:var(--primary);}
.btn-ghost:hover{background:var(--primary-light);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ---------- Badges / chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.chip-dot{width:6px;height:6px;border-radius:50%;}
.chip-confirmed{background:var(--info-bg);color:var(--info);}
.chip-confirmed .chip-dot{background:var(--info);}
.chip-waiting{background:var(--warning-bg);color:var(--warning);}
.chip-waiting .chip-dot{background:var(--warning);}
.chip-completed{background:var(--success-bg);color:var(--success);}
.chip-completed .chip-dot{background:var(--success);}
.chip-cancelled{background:var(--danger-bg);color:var(--danger);}
.chip-cancelled .chip-dot{background:var(--danger);}
.chip-paid{background:var(--success-bg);color:var(--success);}
.chip-pending{background:var(--warning-bg);color:var(--warning);}
.chip-refunded{background:#EEF0F6;color:#5B6478;}
.chip-low{background:var(--danger-bg);color:var(--danger);}
.chip-ok{background:var(--success-bg);color:var(--success);}
.tag{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);padding:3px 9px;border-radius:7px;font-size:11px;font-weight:500;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.id-code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--primary-dark);font-weight:600;}
.cell-primary{font-weight:600;}
.cell-sub{font-size:11.5px;color:var(--muted);}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;display:flex;align-items:stretch;background:var(--bg);
}
.login-visual{
  flex:1.1;background:radial-gradient(120% 120% at 20% 15%,#0E7C9C 0%,var(--primary-dark) 55%,#062F3D 100%);
  color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.login-visual::after{
  content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,0.35),transparent 70%);
}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
.login-card{width:100%;max-width:380px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.role-card{
  border:1.5px solid var(--border);border-radius:12px;padding:14px 12px;text-align:left;background:#fff;
  display:flex;flex-direction:column;gap:8px;transition:all .12s ease;
}
.role-card:hover{border-color:var(--primary);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.role-card.selected{border-color:var(--primary);background:var(--primary-light);}
.role-card-icon{width:32px;height:32px;border-radius:9px;background:var(--accent-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;}
.role-card-icon svg{width:16px;height:16px;}
.role-card-label{font-size:12.5px;font-weight:700;}
.role-card-sub{font-size:10.5px;color:var(--muted);}
.input{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  font-size:13.5px;outline:none;background:#fff;margin-top:6px;
}
.input:focus{border-color:var(--primary);}
.label{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:14px;display:block;}
.stat-strip{display:flex;gap:26px;margin-top:30px;}
.stat-strip div b{font-family:'Sora';font-size:22px;display:block;}
.stat-strip div span{font-size:11px;color:rgba(255,255,255,0.7);}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.empty-note{color:var(--muted);font-size:12.5px;text-align:center;padding:26px;}
.progress-track{height:7px;border-radius:20px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;background:var(--accent);}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:11px;flex-shrink:0;}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.pill-select{display:flex;gap:8px;flex-wrap:wrap;}
.pill-opt{padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);font-size:12.5px;font-weight:600;background:#fff;color:var(--ink-2);}
.pill-opt.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}
.pill-opt:disabled{opacity:0.35;cursor:not-allowed;text-decoration:line-through;}
.wizard-steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;}
.wizard-step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;}
.wizard-num{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--border);}
.wizard-step.done .wizard-num{background:var(--success);color:#fff;border-color:var(--success);}
.wizard-step.active .wizard-num{background:var(--primary);color:#fff;border-color:var(--primary);}
.wizard-step.active{color:var(--ink);}
.wizard-line{flex:1;height:1px;background:var(--border);margin:0 4px;}
.doctor-card{border:1.5px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:#fff;}
.doctor-card.selected{border-color:var(--primary);background:var(--primary-light);}
.notif-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.notif-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.link-btn{color:var(--primary);font-size:12.5px;font-weight:600;}
.receipt{border:1px dashed var(--border);border-radius:12px;padding:22px;background:var(--surface-2);}
.receipt-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);font-weight:700;margin-bottom:10px;}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;}
.bar{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--primary));}
.bar-label{font-size:10.5px;color:var(--muted);}
.donut-wrap{display:flex;align-items:center;gap:20px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px;}
.legend-dot{width:9px;height:9px;border-radius:3px;}
.queue-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.queue-col{background:var(--surface-2);border-radius:12px;padding:12px;min-height:200px;}
.queue-col-head{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.queue-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--border);}
.kv:last-child{border-bottom:none;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,26,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:26px;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;}
.workflow-pipe{display:flex;flex-direction:column;gap:0;}
.wf-node{display:flex;align-items:center;gap:16px;padding:16px 0;}
.wf-icon{width:46px;height:46px;border-radius:12px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wf-icon svg{width:22px;height:22px;}
.wf-connector{width:2px;height:26px;background:var(--border);margin-left:23px;}
.wf-title{font-weight:700;font-size:14.5px;}
.wf-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--primary);border-color:var(--primary);}
.rx-preview{border:1px solid var(--border);border-radius:12px;padding:22px;background:#fff;}
.rx-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--primary);padding-bottom:14px;margin-bottom:14px;}
.help-fab{position:fixed;bottom:22px;right:26px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:30px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);z-index:50;}
.help-fab svg{width:14px;height:14px;}

/* ---------- Feature Modals ---------- */
.feat-modal-overlay{position:fixed;inset:0;background:rgba(10,20,26,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(2px);}
.feat-modal{background:#fff;border-radius:18px;max-width:540px;width:100%;padding:28px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.feat-modal-title{font-family:'Sora';font-size:17px;font-weight:700;margin-bottom:4px;}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s;margin:16px 0;}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light);}
.upload-zone svg{color:var(--primary-dark);}
.report-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);margin-bottom:8px;}
.report-item-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-warning{background:var(--warning-bg);color:var(--warning);border:1px solid transparent;}
.btn-warning:hover{filter:brightness(0.95);}

@media (max-width:1100px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
}
@keyframes pulse {
  0% { transform: scale(0.95); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.5; }
}
@keyframes shimmer {
  0% { background-position: -200px 0; }
  100% { background-position: 200px 0; }
}
.shimmer-loader {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
  background-size: 200px 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
  height: 14px;
  margin-bottom: 8px;
}
.voice-wave {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 8px;
}
.voice-bar {
  width: 3px;
  height: 12px;
  background: var(--danger);
  border-radius: 3px;
  animation: bounce 0.6s ease-in-out infinite alternate;
}
.voice-bar:nth-child(2) { height: 18px; animation-delay: 0.15s; }
.voice-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }

let activeRecognition = null;
let speechTypingInterval = null;

function updateNotes(pid, val) {
  const draft = getConsultationDraft(pid);
  draft.notes = val;
}

function selectScenario(pid, val) {
  const draft = getConsultationDraft(pid);
  draft.selectedScenario = val;
  
  if (speechTypingInterval) clearInterval(speechTypingInterval);
  if (activeRecognition) {
    try { activeRecognition.stop(); } catch(e) {}
    activeRecognition = null;
  }
  
  if (!val) {
    draft.notes = "";
    draft.aiSummary = "";
    draft.suggestedMeds = [];
    draft.suggestedTreatment = "";
    render();
    return;
  }
  
  const scenario = CLINICAL_SCENARIOS[val];
  if (!scenario) return;
  
  // Simulate doctor speaking in real time
  draft.isListening = true;
  draft.isAnalyzing = false;
  draft.notes = "";
  draft.aiSummary = "";
  draft.suggestedMeds = [];
  draft.suggestedTreatment = "";
  render();
  
  const words = scenario.notes.split(" ");
  let i = 0;
  speechTypingInterval = setInterval(() => {
    if (i < words.length) {
      draft.notes += (i === 0 ? "" : " ") + words[i];
      i++;
      const el = document.getElementById('notes-textarea');
      if (el) {
        el.value = draft.notes;
        el.scrollTop = el.scrollHeight;
      }
    } else {
      clearInterval(speechTypingInterval);
      speechTypingInterval = null;
      draft.isListening = false;
      render();
      triggerAIAnalysis(pid, val);
    }
  }, 80);
}

function toggleVoiceDictation(pid) {
  const draft = getConsultationDraft(pid);
  
  if (speechTypingInterval) {
    clearInterval(speechTypingInterval);
    speechTypingInterval = null;
  }
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast("Web Speech API is not supported. Use the Demo Scenarios dropdown instead!");
    return;
  }
  
  if (draft.isListening) {
    if (activeRecognition) {
      try { activeRecognition.stop(); } catch(e) {}
    }
    draft.isListening = false;
    render();
    return;
  }
  
  // Start Speech Recognition
  draft.isListening = true;
  draft.selectedScenario = "";
  draft.isAnalyzing = false;
  draft.notes = "";
  draft.aiSummary = "";
  draft.suggestedMeds = [];
  draft.suggestedTreatment = "";
  render();
  
  const rec = new SpeechRecognition();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';
  activeRecognition = rec;
  
  rec.onresult = (event) => {
    let text = "";
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        text += event.results[i][0].transcript;
      }
    }
    if (text) {
      draft.notes = (draft.notes ? draft.notes + " " : "") + text.trim();
      const el = document.getElementById('notes-textarea');
      if (el) {
        el.value = draft.notes;
        el.scrollTop = el.scrollHeight;
      }
    }
  };
  
  rec.onerror = (e) => {
    console.error("Speech Recognition Error", e);
    draft.isListening = false;
    render();
  };
  
  rec.onend = () => {
    if (draft.isListening) {
      draft.isListening = false;
      render();
      triggerAIAnalysis(pid, null);
    }
  };
  
  rec.start();
}

function triggerAIAnalysis(pid, scenarioKey) {
  const draft = getConsultationDraft(pid);
  draft.isAnalyzing = true;
  render();
  
  setTimeout(() => {
    draft.isAnalyzing = false;
    
    let result = null;
    if (scenarioKey && CLINICAL_SCENARIOS[scenarioKey]) {
      result = CLINICAL_SCENARIOS[scenarioKey];
    } else {
      // Analyze custom text
      const text = (draft.notes || "").toLowerCase();
      if (text.includes("pain") || text.includes("severe") || text.includes("sensitive") || text.includes("molar") || text.includes("canal")) {
        result = CLINICAL_SCENARIOS.root_canal;
      } else if (text.includes("bleed") || text.includes("gum") || text.includes("scaling") || text.includes("tartar")) {
        result = CLINICAL_SCENARIOS.scaling;
      } else if (text.includes("wisdom") || text.includes("extraction") || text.includes("extract")) {
        result = CLINICAL_SCENARIOS.extraction;
      } else {
        result = CLINICAL_SCENARIOS.braces;
      }
    }
    
    draft.aiSummary = result.aiSummary;
    draft.suggestedMeds = [...result.suggestedMeds];
    draft.suggestedTreatment = result.suggestedTreatment;
    draft.approved = false;
    
    render();
    toast("AI notes & suggestions ready!");
  }, 1200);
}

function applyMedsToPrescription(pid) {
  const draft = getConsultationDraft(pid);
  if (!draft.suggestedMeds || draft.suggestedMeds.length === 0) return;
  
  let rx = DATA.prescriptions.find(x => x.pid === pid && x.status === 'Pending');
  if (!rx) {
    rx = {
      id: 'RX-' + Math.floor(Math.random()*90000+10000),
      patient: DATA.patients.find(x => x.id === pid).name,
      pid: pid,
      doctor: 'Dr. Rohan Mehta',
      date: '08 Jul 2026',
      meds: [],
      status: 'Pending'
    };
    DATA.prescriptions.push(rx);
  }
  
  draft.suggestedMeds.forEach(smed => {
    if (!rx.meds.some(m => m.name === smed.name)) {
      rx.meds.push({...smed});
    }
  });
  
  toast("Suggested medicines added to draft prescription!");
  render();
}

function applyTreatment(pid) {
  const draft = getConsultationDraft(pid);
  if (!draft.suggestedTreatment) return;
  
  if (!DATA.treatmentPlans[pid]) {
    DATA.treatmentPlans[pid] = [];
  }
  
  const plan = DATA.treatmentPlans[pid];
  const nextSessionNum = plan.length + 1;
  
  if (plan.some(s => s.proc === draft.suggestedTreatment && s.status === 'Waiting')) {
    toast("Treatment already scheduled in active plan!");
    return;
  }
  
  plan.push({
    step: 'Session ' + nextSessionNum,
    proc: draft.suggestedTreatment,
    date: '22 Jul 2026',
    status: 'Waiting'
  });
  
  toast("Suggested procedure added to Treatment Plan!");
  render();
}

function removeMed(pid, medName) {
  let rx = DATA.prescriptions.find(x => x.pid === pid && x.status === 'Pending');
  if (rx) {
    rx.meds = rx.meds.filter(m => m.name !== medName);
    render();
    toast("Medicine removed");
  }
}

/* ================= CHARTS (pure CSS/SVG) ================= */
function barChart(labels, values, max){
  max = max || Math.max(...values)*1.2;
  return `<div class="bar-chart">${labels.map((l,i)=>`
    <div class="bar-col">
      <div style="font-size:11px;font-weight:700;color:var(--ink-2);">${values[i]}</div>
      <div class="bar" style="height:${(values[i]/max*120)+10}px;"></div>
      <div class="bar-label">${l}</div>
    </div>`).join('')}</div>`;
}
function donutChart(segments,size=140){
  // segments: [{label, value, color}]
  const total=segments.reduce((a,s)=>a+s.value,0);
  let acc=0; const r=size/2-14, c=2*Math.PI*r, cx=size/2, cy=size/2;
  const circles=segments.map(s=>{
    const frac=s.value/total; const dash=frac*c; const gap=c-dash;
    const offset=c*(1-acc); acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Sora" font-size="18" font-weight="700" fill="var(--ink)">${total}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--muted)">total</text></svg>
    <div>${segments.map(s=>`<div class="legend-row"><span class="legend-dot" style="background:${s.color}"></span>${s.label} — <b>${s.value}</b></div>`).join('')}</div>
  </div>`;
}

function completeConsultation(pid, pname){
  const apts = DATA.appointments.filter(a => a.pid === pid && (a.status==='Waiting'||a.status==='Confirmed'));
  apts.forEach(a => a.status = 'Completed');
  toast('✓ Consultation marked as complete for ' + (pname||'Patient') + '!');
  render();
}

function generateConsultationReport(pid, pname){
  const draft = getConsultationDraft(pid);
  const doctor = 'Dr. Rohan Mehta';
  const today = '09 Jul 2026';
  const treatment = draft.suggestedTreatment || 'General Consultation';
  const summary = draft.aiSummary
    ? draft.aiSummary.substring(0, 120) + (draft.aiSummary.length > 120 ? '…' : '')
    : 'Consultation notes recorded by ' + doctor + '.';

  const reportName = treatment + ' — Consultation Report · ' + today;
  // avoid duplicate on same day
  const alreadyExists = uploadedReports.some(r => r.name === reportName);
  if(alreadyExists){
    toast('Consultation report already sent to patient for today!');
    return;
  }
  uploadedReports.unshift({
    name: reportName,
    type: 'Consultation Report',
    date: today,
    doc: doctor,
    notes: summary,
  });
  toast('✓ Consultation report sent to ' + (pname||'Patient') + '\'s Medical Reports!');
  render();
}

function dTreatment(){

    DATA.treatmentPlans[p.id] = [

  const plan = DATA.treatmentPlans[p.id];
  const completed = plan.filter(s => s.status === 'Completed').length;

  return `<div class="card">

            <button class="btn btn-sm btn-danger" onclick="deleteReport(${i})">${icon('logout',12)}</button>
          </div>`).join('')}
        ${uploadedReports.length===0?`<div class="empty-note">No reports uploaded yet.</div>`:''}
      </div>
      <div class="flex gap-8 mt" style="border-top:1px solid var(--border);padding-top:14px;">
        <button class="btn btn-outline btn-block" onclick="closeUploadModal()">Close</button>
        <button class="btn btn-primary btn-block" onclick="handleFakeUpload()">${icon('plus',14)} Upload New Report</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(div);
}

function handleFakeUpload(){
  const names = ['MRI Scan Report — Jul 2026','Dental X-Ray (OPG) — Jul 2026','Blood Glucose Test — Jul 2026','Allergy Panel Report — Jun 2026'];
  const types = ['MRI Scan','X-Ray','Lab Report','Lab Report'];
  const picked = Math.floor(Math.random()*4);
  uploadedReports.push({name:names[picked], type:types[picked], date:'09 Jul 2026', doc:'Uploaded by Patient'});
  toast('Report uploaded successfully!');
  renderUploadModal();
}

function deleteReport(idx){
  uploadedReports.splice(idx,1);
  renderUploadModal();
  toast('Report removed.');
}

/* ================= RESCHEDULE MODAL ================= */
const rescheduleState = { selectedApt:null, newDate:null, newSlot:null };

function openRescheduleModal(aptId){
  const preBooked = DATA.appointments.filter(a=>a.patient===state.patient.name && (a.status==='Confirmed'||a.status==='Waiting'));
  rescheduleState.selectedApt = aptId || (preBooked[0]?preBooked[0].id:null);
  rescheduleState.newDate = null;
  rescheduleState.newSlot = null;
  renderRescheduleModal();
}

function closeRescheduleModal(){
  const el = document.getElementById('reschedule-modal-root');
  if(el) el.remove();
}

function renderRescheduleModal(){
  let existing = document.getElementById('reschedule-modal-root');
  if(existing) existing.remove();
  const preBooked = DATA.appointments.filter(a=>a.patient===state.patient.name && (a.status==='Confirmed'||a.status==='Waiting'));
  if(preBooked.length===0){
    toast('No active booked appointments to reschedule.');
    return;
  }
  const selApt = DATA.appointments.find(a=>a.id===rescheduleState.selectedApt)||preBooked[0];
  const dates=['09 Jul','10 Jul','11 Jul','14 Jul','15 Jul','16 Jul','17 Jul'];
  const div = document.createElement('div');
  div.id = 'reschedule-modal-root';
  div.innerHTML = `
  <div class="feat-modal-overlay" onclick="if(event.target===this)closeRescheduleModal()">
    <div class="feat-modal">
      <div class="flex-between mb">
        <div>
          <div class="feat-modal-title">${icon('calendar',18)} &nbsp;Reschedule Appointment</div>
          <div class="cell-sub">Select a pre-booked appointment and choose a new date &amp; slot.</div>
        </div>
        <button class="btn btn-sm btn-outline" onclick="closeRescheduleModal()" style="padding:6px 10px;">✕</button>
      </div>

      <div class="section-label">Select Appointment to Reschedule</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px;">
        ${preBooked.map(a=>`
          <div class="doctor-card ${selApt&&selApt.id===a.id?'selected':''}" onclick="rescheduleState.selectedApt='${a.id}';renderRescheduleModal()" style="cursor:pointer;">
            <div class="notif-icon" style="background:var(--info-bg);color:var(--info);flex-shrink:0;">${icon('calendar',15)}</div>
            <div style="flex:1;">
              <div class="cell-primary">${a.doctor} <span class="cell-sub">· ${a.type}</span></div>
              <div class="cell-sub">${a.date} at ${a.time} · ${a.branch}</div>
            </div>
            ${chipForStatus(a.status)}
          </div>`).join('')}
      </div>

      <div class="section-label">New Date</div>
      <div class="pill-select" style="flex-wrap:wrap;margin-bottom:16px;">
        ${dates.map(d=>`<button class="pill-opt ${rescheduleState.newDate===d?'selected':''}" onclick="rescheduleState.newDate='${d}';renderRescheduleModal()">${d}</button>`).join('')}
      </div>

      <div class="section-label">New Time Slot ${rescheduleState.newDate?'— '+rescheduleState.newDate+' 2026':''}</div>
      <div class="pill-select" style="flex-wrap:wrap;margin-bottom:18px;">
        ${DATA.slots.map(s=>`<button class="pill-opt ${rescheduleState.newSlot===s?'selected':''}" ${DATA.bookedSlots.includes(s)?'disabled':''} onclick="rescheduleState.newSlot='${s}';renderRescheduleModal()">${s}</button>`).join('')}
      </div>
      <div class="cell-sub" style="margin-bottom:16px;">${icon('info',12)} Greyed-out slots are already booked.</div>

      ${rescheduleState.newDate&&rescheduleState.newSlot&&selApt?`
        <div class="card" style="background:var(--info-bg);border:none;margin-bottom:14px;">
          <div class="cell-sub" style="margin-bottom:6px;">New appointment summary:</div>
          <div class="kv"><span>Doctor</span><b>${selApt.doctor}</b></div>
          <div class="kv"><span>Date &amp; Time</span><b>${rescheduleState.newDate} 2026, ${rescheduleState.newSlot}</b></div>
          <div class="kv"><span>Branch</span><b>${selApt.branch}</b></div>
        </div>`:''}

      <div class="flex gap-8" style="border-top:1px solid var(--border);padding-top:14px;">
        <button class="btn btn-outline btn-block" onclick="closeRescheduleModal()">Cancel</button>
        <button class="btn btn-primary btn-block" ${!rescheduleState.newDate||!rescheduleState.newSlot?'disabled':''} onclick="confirmReschedule()">${icon('check',14)} Confirm Reschedule</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(div);
}

function confirmReschedule(){
  const apt = DATA.appointments.find(a=>a.id===rescheduleState.selectedApt);
  if(!apt||!rescheduleState.newDate||!rescheduleState.newSlot) return;
  apt.date = rescheduleState.newDate+' 2026';
  apt.time = rescheduleState.newSlot;
  apt.status = 'Confirmed';
  closeRescheduleModal();
  toast('Appointment rescheduled successfully! Confirmation sent.');
  render();
}

/* ================= MEDICAL REPORTS PAGE ================= */
function pMedReports(){
  const typeColors = {
    'X-Ray':'var(--info)', 'Lab Report':'var(--success)', 'MRI Scan':'var(--primary)',
    'Discharge Summary':'var(--warning)', 'Prescription':'var(--accent)',
    'Consultation Report':'var(--primary-dark)', 'Other':'var(--muted)'
  };
  const typeBg = {
    'X-Ray':'var(--info-bg)', 'Lab Report':'var(--success-bg)', 'MRI Scan':'var(--primary-light)',
    'Discharge Summary':'var(--warning-bg)', 'Prescription':'var(--accent-light)',
    'Consultation Report':'#E4F1F5', 'Other':'var(--surface-2)'
  };
  return `
  <div class="card mb" style="background:linear-gradient(120deg,var(--primary-dark),var(--primary));color:#fff;border:none;padding:22px 26px;">
    <div class="flex-between">
      <div>
        <div style="font-size:12px;opacity:0.8;margin-bottom:4px;">Patient Records</div>
        <h2 style="color:#fff;font-size:20px;margin:0;">Medical Reports</h2>
        <div style="font-size:12.5px;opacity:0.75;margin-top:4px;">All uploaded reports, X-rays, lab results &amp; summaries</div>
      </div>
      <button class="btn btn-accent" onclick="handleFakeUpload();go('medreports')">${icon('plus',15)} Upload New Report</button>
    </div>
  </div>
  <div class="grid grid-4 mb">
    <div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:var(--info-bg);color:var(--info)">${icon('file')}</div></div><div class="stat-value">${uploadedReports.length}</div><div class="stat-label">Total Reports</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:var(--success-bg);color:var(--success)">${icon('activity')}</div></div><div class="stat-value">${uploadedReports.filter(r=>r.type==='Lab Report').length}</div><div class="stat-label">Lab Reports</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary-dark)">${icon('search')}</div></div><div class="stat-value">${uploadedReports.filter(r=>r.type==='X-Ray'||r.type==='MRI Scan').length}</div><div class="stat-label">Imaging Reports</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:var(--warning-bg);color:var(--warning)">${icon('download')}</div></div><div class="stat-value">${uploadedReports.filter(r=>r.doc==='Uploaded by Patient').length}</div><div class="stat-label">Self-Uploaded</div></div>
  </div>
  <div class="card">
    <div class="flex-between mb">
      <div class="card-title">All Reports (${uploadedReports.length})</div>
      <button class="btn btn-primary btn-sm" onclick="handleFakeUpload();go('medreports')">${icon('plus',13)} Upload New Report</button>
    </div>
    ${uploadedReports.length === 0 ? `
      <div style="text-align:center;padding:60px 20px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--muted);">${icon('file',28)}</div>
        <div style="font-size:15px;font-weight:700;margin-top:16px;color:var(--ink-2);">No reports uploaded yet</div>
        <div class="cell-sub" style="margin-top:6px;">Upload your past medical reports, X-rays, and lab results here.</div>
        <button class="btn btn-primary mt" onclick="handleFakeUpload();go('medreports')">${icon('plus',14)} Upload First Report</button>
      </div>` : `
    <div class="grid grid-2">
      ${uploadedReports.map((r,i)=>`
        <div class="card" style="border:1px solid var(--border);padding:16px 18px;">
          <div class="flex-between" style="margin-bottom:10px;">
            <div class="flex gap-10">
              <div style="width:40px;height:40px;border-radius:11px;background:${typeBg[r.type]||'var(--surface-2)'};color:${typeColors[r.type]||'var(--muted)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon('file',18)}</div>
              <div>
                <div class="cell-primary" style="font-size:13.5px;">${r.name}</div>
                <div class="cell-sub">${r.doc}</div>
              </div>
            </div>
            <span class="chip" style="background:${typeBg[r.type]||'var(--surface-2)'};color:${typeColors[r.type]||'var(--muted)'}">${r.type}</span>
          </div>
          <div class="kv"><span>Date</span><b>${r.date}</b></div>
          <div class="kv"><span>Uploaded By</span><b>${r.doc}</b></div>
          <div class="flex gap-8 mt-sm" style="margin-top:12px;">
            <button class="btn btn-sm btn-outline btn-block">${icon('download',12)} Download</button>
            <button class="btn btn-sm btn-danger" style="flex:0 0 auto;" onclick="deleteReportAndRefresh(${i})">${icon('logout',12)}</button>
          </div>
        </div>`).join('')}
    </div>`}
  </div>`;
}

function deleteReportAndRefresh(idx){
  uploadedReports.splice(idx,1);
  toast('Report removed.');
  render();
}

/* ================= ROUTER / RENDER ================= */
function screenBody(){
  if(state.role==='patient'){
    return {dashboard:pDashboard, book:pBook, bookConfirmed:pBookConfirmed, upcoming:pUpcoming, history:pHistory,
      medreports:pMedReports, prescriptions:pPrescriptions, rxPreview:()=>rxPreviewScreen(), billing:pBilling, invoiceView:invoiceView,
      tele:pTele, notifications:pNotifications, profile:pProfile, workflow:workflowPage}[state.screen]?.() || pDashboard();
  }
  if(state.role==='receptionist'){
    return {dashboard:rDashboard, calendar:rCalendar, queue:rQueue, checkin:rCheckin, search:rSearch,
      register:()=>rRegister(false), walkin:()=>rRegister(true), billing:rBilling, invoice:invoiceView, invoiceView:invoiceView,
      workflow:workflowPage}[state.screen]?.() || rDashboard();
  }
  if(state.role==='doctor'){
    return {dashboard:dDashboard, queue:dQueue, consultation:dConsultation, prescription:dPrescription,
      treatment:dTreatment, followup:dFollowup, history:pHistory, workflow:workflowPage}[state.screen]?.() || dDashboard();
  }
  if(state.role==='pharmacist'){
    return {dashboard:phDashboard, rxqueue:phRxQueue, dispense:phDispense, inventory:phInventory, purchase:phPurchase,
      rxPreview:()=>rxPreviewScreen(), workflow:workflowPage}[state.screen]?.() || phDashboard();
  }
  if(state.role==='admin'){
    return {dashboard:aDashboard, staff:aStaff, branches:aBranches, reports:aReports, invreports:aInvReports,
      settings:aSettings, workflow:workflowPage}[state.screen]?.() || aDashboard();
  }
  return '';
}

function render(){
  const app=document.getElementById('app');
  if(!state.role){ app.innerHTML=renderLogin(); return; }
  app.innerHTML=`
    <div class="shell">
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        <div class="content"><div class="content-inner">${screenBody()}</div></div>
      </div>
    </div>
    ${state.toast?`<div style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;">${icon('check',14)} &nbsp;${state.toast}</div>`:''}
  `;
}
render();
</script>
